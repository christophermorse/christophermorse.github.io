<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Christopher M. Morse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="instrument" aria-label="Choose a year">
        <header class="who">
          <div class="ident">
            <img id="portrait" alt="" hidden />
            <div>
              <h1><a id="name" href="./" title="Back to the present"></a></h1>
              <p id="pos"></p>
            </div>
          </div>
        </header>
        <div class="dock" id="dock">
          <svg
            id="astro"
            viewBox="0 -12 500 532"
            role="group"
            aria-label="Astrolabe of years. Turn the pointer to choose a year; the page beside it shows that year."
          ></svg>
          <div class="cartouche">
            <button type="button" id="prev" aria-label="Previous year">‹</button
            ><output id="anno" aria-live="polite"></output
            ><button type="button" id="next" aria-label="Next year">›</button>
          </div>
          <p class="rings-key">
            Turn the pointer, or click the rim. Rings, outside in: Language &amp; AI, Research,
            Learning, Community.
          </p>
        </div>
      </aside>
      <main class="leaf" id="leaf">
        <div class="overview">
          <svg
            id="overview"
            role="group"
            aria-label="Every year at a glance; select one to open it"
          ></svg>
          <div class="overview-cap">
            <span
              >A star per entry, one at each end of a span; colored by strand, brightest for work
              and degrees.</span
            ><span id="count"></span>
          </div>
        </div>
        <div id="year" aria-live="polite"></div>
        <section class="about" id="about"></section>
      </main>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>
    <script>
      window.CV_DATA = /*DATA*/ null;
    </script>
    <script src="app.js"></script>
  </body>
</html>
