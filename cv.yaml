person:
  first_name: Christopher M.
  last_name: Morse
  suffix: Ph.D.
  position: Computational Linguist · Speech & Language Technology · Human-Centered AI
  photo: profile.png
  summary: >-
    Technology changes how we encounter and experience culture; this much is
    certain. But how do these interactions enable us to connect with culture and
    create meaning from it? That question has shaped my career for more than a
    decade, taking on new dimensions with each attempt to answer it.

    At Harvard, building computational tools for humanities scholars, I explored
    how meaning emerges from historical sources and the new questions computation
    allows us to ask of them. My doctoral research in human-computer interaction
    shifted the focus to museum visitors: what a collection becomes for the person
    standing in front of it. Later, directing an applied AI lab, I turned to the
    gap between what a model decides and what a person can understand of that
    decision. Today, my work brings me to language itself: developing speech and
    language models for Luxembourgish at the Zenter fir d'Lëtzebuerger Sprooch,
    so that a language spoken by fewer than half a million people can be spoken
    to machines as readily as to other people. The tools have evolved, but the
    question remains the same.
  # Your email, phone and address live in cv.private.yaml, which is never pushed:
  # this repository is public, so anything here is served in plain text to anyone
  # at raw.githubusercontent.com. The website offers LinkedIn and Scholar instead.
  linkedin: cmmorse
  google_scholar:
    id: 6ZSS-ZEAAAAJ
    name: Christopher Morse
  github: christophermorse
  homepage: https://christophermorse.github.io/

