experience:
  - title: Computational Linguist
    organization: Zenter fir d'Lëtzebuerger Sprooch / Center for the Luxembourgish Language
    short_org: ZLS
    location: Strassen, Luxembourg
    country: LU
    start: 2024-04-01
    end: present
    themes: [speech, ai-nlp]
    image: assets/sproochmaschinn-launch-2025.jpg
    # The licence on gouvernement.lu allows photos to be reproduced if the source is
    # named, so the credit below must stay visible wherever the picture is used.
    credits: "At the launch, with Daniel Wagener and Alexandre Ecker. Photo © MCULT, [Ministère de la Culture](https://gouvernement.lu/fr/gouvernement/eric-thill/actualites.gouvernement2024+fr+actualites+toutes_actualites+communiques+2025+02-fevrier+10-sproochmaschinn-thill.html)"
    items:   # CONFIRM all of these — drafted from your notes + public sources
      - Trains and maintains the AI models behind [sproochmaschinn.lu](https://sproochmaschinn.lu), one of the first public web platforms for Luxembourgish speech technology, which unites the Schreifmaschinn (speech-to-text) and the Liesmaschinn (text-to-speech). [Launched by the Ministry of Culture](https://gouvernement.lu/fr/gouvernement/eric-thill/actualites.gouvernement2024+fr+actualites+toutes_actualites+communiques+2025+02-fevrier+10-sproochmaschinn-thill.html) in February 2025.
      - Lead designer of the sproochmaschinn.lu web application.
      - Fine-tuned Whisper Large v3 Turbo on Luxembourgish parliamentary and broadcast speech and integrated pyannote speaker diarization; version 2.0 (December 2025) doubled the training data and added speaker recognition and a second synthetic voice.
      - Designs fully on-premise training and inference pipelines, so no audio or text ever leaves government servers.
      - Currently developing streaming speech recognition for live Luxembourgish subtitling.
      - Represents the ZLS's language-technology work internationally, including at UNESCO's LT4All conference (Paris, 2025).

  - title: Director of Labs
    organization: Zortify
    location: Luxembourg, Luxembourg
    country: LU
    start: 2021-09
    end: 2024-02
    themes: [ai-nlp, hci-ux]
    items:
      - Built and led Zortify Labs, an interdisciplinary R&D team of researchers, data scientists, psychologists, and designers working on natural language processing, UX, and explainable AI for HR technology.
      - Co-led, with Dr Siwen Guo, a €1.4 million R&D project funded by the Luxembourg Ministry of the Economy in partnership with SnT (University of Luxembourg), on multilingual NLP models and interfaces that make AI decisions understandable.
      - Translated research into product direction, explaining what AI can and cannot do to clients, executives, and investors.
      - Built research partnerships with universities and industry, and organized the 2023 Zortify Summer School on the Future of Work.
      - Represented the lab publicly through teaching, publications, talks, and press coverage.

  - title: Doctoral Researcher
    organization: University of Luxembourg — Centre for Contemporary & Digital History (C²DH) & Human-Computer Interaction Research Group
    short_org: Uni.lu
    location: Esch-sur-Alzette, Luxembourg
    country: LU
    start: 2017
    end: 2021
    themes: [cultural-heritage, hci-ux]
    items:
      - Investigated how people make meaning from museum collections across physical and digital spaces, drawing on HCI, the psychology of aesthetics, and museology.
      - Designed and ran user studies of visitors' cognitive and emotional responses to digital museum interfaces, in partnership with the Musée National d'Histoire et d'Art (MNHA).
      - Published in *ACM Journal on Computing and Cultural Heritage*, *Behaviour & Information Technology*, and *Museums and the Web*, and taught courses in HCI, digital history, and digital museology.
      - "TEDx speaker: [*Experiential Culture: Feeling the Museum of the Future*](https://www.youtube.com/watch?v=Cp6c0o3N4eQ)"

  - title: Senior Humanities Research Computing Specialist
    organization: Harvard University Arts & Humanities Research Computing
    short_org: Harvard
    location: Cambridge, MA, USA
    country: US
    start: 2013
    end: 2017
    themes: [digital-humanities, cultural-heritage, teaching]
    items:
      - Partnered with humanities faculty to bring computational methods into their research, from linked data and SPARQL to multilingual text mapping.
      - Built scholarly tools on the International Image Interoperability Framework (IIIF), including a digital critical edition of a 16th-century manuscript at the Biblioteca Apostolica Vaticana, and taught IIIF workshops across the university.
      - "Created the IIIF image viewer interface through which visitors explored several of the larger objects in *Beyond Words: Illuminated Manuscripts in Boston Collections*, an exhibit spanning Boston's cultural institutions."
      - Designed data visualizations and interactive tools that made research findings explorable for non-specialist audiences.
      - Organized ten art-and-technology symposia, including the *ArtTechPsyche* and *sIGHTLines* series.

